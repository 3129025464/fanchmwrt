name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform'
        required: true
        default: 'x86-64'
        type: choice
        options:
          - x86-64
          - ramips-mt7621

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo docker image prune --all --force
        df -h

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget

    - name: Update feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load config
      run: |
        TARGET="${{ github.event.inputs.target }}"
        if [ -f "configs/${TARGET}.config" ]; then
          cp "configs/${TARGET}.config" .config
          echo "Using config: configs/${TARGET}.config"
        else
          echo "Config not found, using defconfig"
        fi
        make defconfig
        cat .config | grep CONFIG_TARGET

    - name: Download packages
      run: |
        make download -j8 V=s || make download -j1 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile firmware
      run: |
        echo "Starting build with $(nproc) threads..."
        make -j$(nproc) V=s 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee build.log

    - name: Upload bin
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: openwrt-${{ github.event.inputs.target }}-bin
        path: bin/targets/

    - name: Upload build log on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-log
        path: build.log
